<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TurnoBarber - Acceso del barbero</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>

    <!-- ==========================================================
         ACCESO AUTOMÁTICO DEL BARBERO
    =========================================================== -->

    <main
        id="barberApp"
        class="card hero"
        style="
            max-width: 500px;
            margin: 35px auto;
            text-align: center;
        "
    >

        <h1>
            💈 TurnoBarber
        </h1>


        <h2 id="pageTitle">
            🔐 Acceso del barbero
        </h2>


        <!-- ======================================================
             CARGANDO
        ======================================================= -->

        <section
            id="loadingSection"
            style="
                margin-top: 25px;
            "
        >

            <div
                style="
                    font-size: 52px;
                    margin-bottom: 12px;
                "
            >
                💈
            </div>

            <h2>
                🔄 Preparando tu estación...
            </h2>

            <p
                id="loadingMessage"
                style="
                    opacity: .70;
                "
            >
                Verificando el acceso del barbero.
            </p>

        </section>


        <!-- ======================================================
             INVITACIÓN VÁLIDA
        ======================================================= -->

        <section
            id="invitationSection"
            style="display: none;"
        >

            <div
                class="card"
                style="
                    margin-top: 20px;
                    text-align: center;
                "
            >

                <div
                    style="
                        font-size: 48px;
                        margin-bottom: 8px;
                    "
                >
                    💈
                </div>


                <h2
                    id="barberName"
                    style="
                        margin-bottom: 5px;
                    "
                >
                </h2>


                <p
                    id="businessName"
                    style="
                        margin-top: 0;
                        font-size: 18px;
                    "
                >
                </p>


                <p
                    style="
                        font-size: 14px;
                        opacity: .70;
                        line-height: 1.5;
                    "
                >
                    Acceso exclusivo a tu estación
                    de trabajo.
                </p>


                <div
                    id="accessMessage"
                    style="
                        margin-top: 20px;
                        font-weight: 700;
                    "
                >
                    🔐 Verificando tu acceso...
                </div>

            </div>

        </section>


        <!-- ======================================================
             ERROR
        ======================================================= -->

        <section
            id="errorSection"
            style="display: none;"
        >

            <div
                class="card"
                style="
                    margin-top: 20px;
                    text-align: center;
                "
            >

                <div
                    style="
                        font-size: 48px;
                        margin-bottom: 10px;
                    "
                >
                    ⚠️
                </div>


                <h2>
                    Acceso no disponible
                </h2>


                <p id="errorMessage">
                </p>


                <button
                    id="retryButton"
                    type="button"
                    class="btn primary big"
                    style="
                        width: 100%;
                        margin-top: 15px;
                    "
                >
                    🔄 Intentar nuevamente
                </button>

            </div>

        </section>


        <!-- ======================================================
             INFORMACIÓN DE SEGURIDAD
        ======================================================= -->

        <p
            id="securityMessage"
            style="
                display: none;
                margin-top: 20px;
                font-size: 12px;
                opacity: .55;
            "
        >
            Este dispositivo quedará vinculado
            únicamente a la estación asignada.
        </p>

    </main>


    <!-- ==========================================================
         PANTALLA DE TRABAJO DEL BARBERO
    =========================================================== -->

    <main
        id="barberDashboard"
        style="
            display: none;
            max-width: 760px;
            margin: 25px auto;
            padding: 0 15px 30px;
        "
    ></main>


    <!-- ==========================================================
         SUPABASE
    =========================================================== -->

    <script src="supabase.js"></script>

    <script src="barbero.js"></script>


    <script>

        // ======================================================
        // ESTADO
        // ======================================================

        let invitationToken = null;

        let invitation = null;

        let currentSession = null;

        let accessInProgress = false;


        // ======================================================
        // ELEMENTOS
        // ======================================================

        const loadingSection =
            document.getElementById(
                "loadingSection"
            );


        const loadingMessage =
            document.getElementById(
                "loadingMessage"
            );


        const invitationSection =
            document.getElementById(
                "invitationSection"
            );


        const errorSection =
            document.getElementById(
                "errorSection"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        const barberName =
            document.getElementById(
                "barberName"
            );


        const businessName =
            document.getElementById(
                "businessName"
            );


        const accessMessage =
            document.getElementById(
                "accessMessage"
            );


        const retryButton =
            document.getElementById(
                "retryButton"
            );


        const securityMessage =
            document.getElementById(
                "securityMessage"
            );


        // ======================================================
        // MOSTRAR ERROR
        // ======================================================

        function showError(
            message
        ) {

            accessInProgress =
                false;


            loadingSection.style.display =
                "none";


            invitationSection.style.display =
                "none";


            errorSection.style.display =
                "block";


            securityMessage.style.display =
                "none";


            errorMessage.textContent =
                message;

        }


        // ======================================================
        // MOSTRAR INVITACIÓN
        // ======================================================

        function showInvitation() {

            loadingSection.style.display =
                "none";


            errorSection.style.display =
                "none";


            invitationSection.style.display =
                "block";


            securityMessage.style.display =
                "block";


            barberName.textContent =
                invitation.barber_name;


            businessName.textContent =
                invitation.business_name;

        }


        // ======================================================
        // MOSTRAR PROCESO DE ACCESO
        // ======================================================

        function setAccessMessage(
            message
        ) {

            if (
                accessMessage
            ) {

                accessMessage.textContent =
                    message;

            }

        }


        // ======================================================
        // OBTENER TOKEN DE LA URL
        // ======================================================

        function getInvitationToken() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            return (
                params.get("token") ||
                ""
            ).trim();

        }


        // ======================================================
        // CARGAR INVITACIÓN
        // ======================================================

        async function loadInvitation() {

            invitationToken =
                getInvitationToken();


            if (!invitationToken) {

                showError(
                    "El enlace no contiene una invitación válida."
                );

                return false;

            }


            const {
                data,
                error
            } =
                await client.rpc(
                    "get_barber_invitation",
                    {
                        p_token:
                            invitationToken
                    }
                );


            if (error) {

                console.error(
                    "ERROR CARGANDO INVITACIÓN:",
                    error
                );


                showError(
                    "No fue posible verificar la invitación."
                );


                return false;

            }


            if (
                !data ||
                data.length === 0
            ) {

                showError(
                    "La invitación no existe, ya fue utilizada o expiró."
                );


                return false;

            }


            invitation =
                data[0];


            showInvitation();


            return true;

        }


        // ======================================================
        // OBTENER SESIÓN ACTUAL
        // ======================================================

        async function getCurrentSession() {

            const {
                data,
                error
            } =
                await client.auth.getSession();


            if (error) {
                throw error;
            }


            return data?.session || null;

        }


        // ======================================================
        // VERIFICAR SI LA SESIÓN ACTUAL YA ES
        // EL BARBERO DE ESTA INVITACIÓN
        // ======================================================

        async function isCurrentBarber() {

            try {

                const {
                    data,
                    error
                } =
                    await client.rpc(
                        "get_my_barber"
                    );


                if (error) {
                    return false;
                }


                const barber =
                    data?.[0] || null;


                if (!barber) {
                    return false;
                }


                if (
                    barber.id !==
                    invitation.barber_id
                ) {

                    return false;

                }


                if (
                    barber.active ===
                    false
                ) {

                    return false;

                }


                return true;

            } catch (error) {

                console.error(
                    "ERROR VERIFICANDO BARBERO ACTUAL:",
                    error
                );


                return false;

            }

        }


        // ======================================================
        // CREAR SESIÓN ANÓNIMA
        // ======================================================

        async function createAnonymousSession() {

            setAccessMessage(
                "🔐 Preparando acceso seguro..."
            );


            const {
                data,
                error
            } =
                await client.auth.signInAnonymously();


            if (error) {
                throw error;
            }


            if (
                !data ||
                !data.session
            ) {

                throw new Error(
                    "No fue posible crear la sesión segura del barbero."
                );

            }


            currentSession =
                data.session;


            return data.session;

        }


        // ======================================================
        // ACEPTAR INVITACIÓN
        // ======================================================

        async function acceptInvitation() {

            if (
                !invitationToken ||
                !invitation
            ) {

                throw new Error(
                    "La invitación no está disponible."
                );

            }


            setAccessMessage(
                "🔗 Vinculando tu estación..."
            );


            const {
                data,
                error
            } =
                await client.rpc(
                    "accept_barber_invitation",
                    {
                        p_token:
                            invitationToken
                    }
                );


            if (error) {
                throw error;
            }


            if (
                !data ||
                data.length === 0
            ) {

                throw new Error(
                    "No se pudo activar el acceso del barbero."
                );

            }


            const barber =
                data[0];


            if (
                barber.barber_id !==
                invitation.barber_id
            ) {

                throw new Error(
                    "La invitación no corresponde a esta estación."
                );

            }


            sessionStorage.setItem(
                "turnobarber_barber_id",
                barber.barber_id
            );


            return barber;

        }


        // ======================================================
        // ENTRAR AL DASHBOARD
        // ======================================================

        function enterDashboard() {

            setAccessMessage(
                "✅ Acceso autorizado. Entrando..."
            );


            sessionStorage.setItem(
                "turnobarber_barber_id",
                invitation.barber_id
            );


            setTimeout(
                function() {

                    window.location.href =
                        "barbero.html?mode=dashboard";

                },
                500
            );

        }


        // ======================================================
        // FLUJO PRINCIPAL DE ACCESO
        // ======================================================

        async function processBarberAccess() {

            if (accessInProgress) {
                return;
            }


            accessInProgress =
                true;


            try {

                // ------------------------------------------------
                // 1. Verificar invitación
                // ------------------------------------------------

                const valid =
                    await loadInvitation();


                if (!valid) {

                    accessInProgress =
                        false;

                    return;

                }


                // ------------------------------------------------
                // 2. Revisar si ya existe una sesión
                // ------------------------------------------------

                setAccessMessage(
                    "🔐 Verificando este dispositivo..."
                );


                let session =
                    await getCurrentSession();


                // ------------------------------------------------
                // 3. Si ya existe una sesión,
                //    comprobar si pertenece al barbero correcto
                // ------------------------------------------------

                if (session) {

                    const alreadyLinked =
                        await isCurrentBarber();


                    if (
                        alreadyLinked
                    ) {

                        currentSession =
                            session;


                        enterDashboard();


                        return;

                    }


                    /*
                     * Existe una sesión pero no pertenece
                     * al barbero de esta invitación.
                     *
                     * NO cerramos automáticamente esa sesión,
                     * porque podría ser la cuenta del administrador
                     * o de otro usuario.
                     */

                    throw new Error(
                        "Este dispositivo ya tiene otra sesión de TurnoBarber iniciada. Para activar esta estación utiliza el dispositivo del barbero."
                    );

                }


                // ------------------------------------------------
                // 4. Crear sesión anónima
                // ------------------------------------------------

                session =
                    await createAnonymousSession();


                // ------------------------------------------------
                // 5. Vincular sesión con el barbero
                // ------------------------------------------------

                await acceptInvitation();


                // ------------------------------------------------
                // 6. Confirmar que el vínculo quedó activo
                // ------------------------------------------------

                setAccessMessage(
                    "🔎 Confirmando tu estación..."
                );


                const linked =
                    await isCurrentBarber();


                if (!linked) {

                    throw new Error(
                        "El acceso fue creado, pero no se pudo confirmar la estación."
                    );

                }


                // ------------------------------------------------
                // 7. Entrar
                // ------------------------------------------------

                enterDashboard();


            } catch (error) {

                console.error(
                    "ERROR ACCESO AUTOMÁTICO BARBERO:",
                    error
                );


                showError(
                    error?.message ||
                    "No fue posible activar el acceso del barbero."
                );

            } finally {

                accessInProgress =
                    false;

            }

        }


        // ======================================================
        // REINTENTAR
        // ======================================================

        retryButton.addEventListener(
            "click",
            function() {

                window.location.reload();

            }
        );


        // ======================================================
        // CONTROL DE SESIÓN
        // ======================================================

        client.auth.onAuthStateChange(
            function(
                event,
                session
            ) {

                console.log(
                    "BARBER AUTH EVENT:",
                    event
                );


                if (
                    event ===
                    "SIGNED_OUT"
                ) {

                    currentSession =
                        null;

                }


                if (
                    session
                ) {

                    currentSession =
                        session;

                }

            }
        );


        // ======================================================
        // INICIO
        // ======================================================

        async function initBarberAccess() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            /*
             * Si ya estamos entrando al dashboard,
             * barbero.js se encarga del resto.
             */

            if (
                params.get("mode") ===
                "dashboard"
            ) {

                return;

            }


            await processBarberAccess();

        }


        // ======================================================
        // ARRANQUE
        // ======================================================

        document.addEventListener(
            "DOMContentLoaded",
            initBarberAccess
        );

    </script>

</body>

</html>
