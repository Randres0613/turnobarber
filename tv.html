<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TurnoBarber - Pantalla</title>
    <meta name="turnobarber-tv-version" content="2.0-sonido">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        .screen {

            width: 100%;

            max-width: 1400px;

            min-height: 100vh;

            padding: 40px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            text-align: center;
        }


        /* =================================
           ENCABEZADO
        ================================= */

        .header {

            margin-bottom: 40px;
        }


        .header h1 {

            margin: 0;

            font-size: clamp(
                32px,
                5vw,
                64px
            );
        }


        .header p {

            margin-top: 10px;

            font-size: clamp(
                18px,
                2vw,
                28px
            );

            opacity: 0.7;
        }


        .online {

            display: inline-block;

            margin-top: 15px;

            padding: 8px 18px;

            border-radius: 30px;

            background: #16803c;

            font-size: 16px;

            font-weight: bold;
        }


        /* =================================
           BOTÓN SONIDO
        ================================= */

        .sound-button {

            display: block !important;
            visibility: visible !important;
            position: fixed;

            top: 20px;

            right: 20px;

            z-index: 20;

            border: none;

            border-radius: 30px;

            padding: 12px 20px;

            background: #222;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .sound-button.active {

            background: #16803c;
        }


        /* =================================
           TARJETAS
        ================================= */

        .main {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 30px;
        }


        .card {

            background: #1d1d1d;

            border-radius: 24px;

            padding: 40px;

            min-height: 350px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }


        .card h2 {

            margin: 0 0 25px;

            font-size: clamp(
                24px,
                3vw,
                40px
            );
        }


        .current {

            border: 3px solid #16803c;
        }


        .next {

            border: 3px solid #444;
        }


        .ticket {

            font-size: clamp(
                80px,
                13vw,
                180px
            );

            font-weight: bold;

            line-height: 1;

            margin: 20px 0;
        }


        .service {

            font-size: clamp(
                24px,
                3vw,
                42px
            );

            opacity: 0.85;
        }


        .waiting {

            font-size: clamp(
                55px,
                8vw,
                110px
            );

            font-weight: bold;

            opacity: 0.5;

            margin: 30px 0;
        }


        .footer {

            margin-top: 40px;

            font-size: 20px;

            opacity: 0.5;
        }


        /* =================================
           AVISO DE LLAMADA
        ================================= */

        .call-overlay {

            position: fixed;

            inset: 0;

            z-index: 10;

            background: rgba(0, 0, 0, 0.92);

            display: none;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            text-align: center;

            padding: 30px;
        }


        .call-overlay.show {

            display: flex;
        }


        .call-title {

            font-size: clamp(
                35px,
                6vw,
                80px
            );

            font-weight: bold;

            margin-bottom: 30px;
        }


        .call-ticket {

            font-size: clamp(
                110px,
                20vw,
                280px
            );

            font-weight: bold;

            line-height: 1;

            margin: 20px 0;
        }


        .call-service {

            font-size: clamp(
                30px,
                5vw,
                65px
            );

            opacity: 0.9;
        }


        .call-message {

            margin-top: 35px;

            font-size: clamp(
                25px,
                4vw,
                50px
            );

            font-weight: bold;
        }


        /* =================================
           ANIMACIÓN
        ================================= */

        .pulse {

            animation:
                pulse 0.8s
                infinite alternate;
        }


        @keyframes pulse {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.04);
            }

        }


        /* =================================
           MÓVIL
        ================================= */

        @media (max-width: 700px) {

            .screen {

                padding: 20px;
            }


            .main {

                grid-template-columns: 1fr;
            }


            .card {

                min-height: 250px;

                padding: 25px;
            }


            .sound-button {

                top: 10px;

                right: 10px;

                font-size: 13px;

                padding: 10px 14px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         BOTÓN SONIDO
    ================================= -->

    <button
        id="soundButton"
        class="sound-button"
        onclick="activateSound()"
    >
        🔇 Activar sonido
    </button>


    <!-- =================================
         PANTALLA PRINCIPAL
    ================================= -->

    <main class="screen">


        <header class="header">

            <h1 id="businessName">
                💈 TurnoBarber
            </h1>


            <p id="businessCity">
                Cargando barbería...
            </p>


            <span class="online">
                ONLINE
            </span>

        </header>


        <section class="main">


            <!-- =============================
                 TURNO ACTUAL
            ============================== -->

            <div class="card current">

                <h2>
                    🟢 AHORA ATENDIENDO
                </h2>


                <div
                    id="currentTicket"
                    class="ticket"
                >
                    —
                </div>


                <div
                    id="currentService"
                    class="service"
                >
                    Esperando...
                </div>

            </div>


            <!-- =============================
                 SIGUIENTE
            ============================== -->

            <div class="card next">

                <h2>
                    🟡 SIGUIENTE
                </h2>


                <div
                    id="nextTicket"
                    class="waiting"
                >
                    —
                </div>


                <div
                    id="nextService"
                    class="service"
                >
                    —
                </div>

            </div>

        </section>


        <footer class="footer">

            <span id="updateStatus">
                Conectando...
            </span>

        </footer>

    </main>


    <!-- =================================
         AVISO DE LLAMADA
    ================================= -->

    <div
        id="callOverlay"
        class="call-overlay"
    >

        <div class="call-title">
            📢 ES TU TURNO
        </div>


        <div
            id="callTicket"
            class="call-ticket pulse"
        >
            A-000
        </div>


        <div
            id="callService"
            class="call-service"
        >
            Servicio
        </div>


        <div class="call-message">
            🚶 PASA A LA BARBERÍA
        </div>

    </div>


    <!-- =================================
         SUPABASE
    ================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <script src="supabase.js">
    </script>


    <!-- =================================
         LÓGICA
    ================================= -->

    <script>

        // =================================
        // CONFIGURACIÓN
        // =================================

        const slug =
            new URLSearchParams(
                location.search
            ).get("b")
            || "barberia-el-jefe";


        let business = null;


        let previousTicketId = null;


        let firstLoad = true;


        let audioContext = null;


        let soundEnabled = false;


        let overlayTimer = null;


        // =================================
        // ELEMENTOS
        // =================================

        const businessName =
            document.getElementById(
                "businessName"
            );


        const businessCity =
            document.getElementById(
                "businessCity"
            );


        const currentTicket =
            document.getElementById(
                "currentTicket"
            );


        const currentService =
            document.getElementById(
                "currentService"
            );


        const nextTicket =
            document.getElementById(
                "nextTicket"
            );


        const nextService =
            document.getElementById(
                "nextService"
            );


        const updateStatus =
            document.getElementById(
                "updateStatus"
            );


        const soundButton =
            document.getElementById(
                "soundButton"
            );


        const callOverlay =
            document.getElementById(
                "callOverlay"
            );


        const callTicket =
            document.getElementById(
                "callTicket"
            );


        const callService =
            document.getElementById(
                "callService"
            );


        // =================================
        // ACTIVAR SONIDO
        // =================================

        function activateSound() {

            try {

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

                audioContext.resume();

                soundEnabled = true;

                soundButton.textContent =
                    "🔊 Sonido activado";

                soundButton.classList.add(
                    "active"
                );

                // La primera locución se hace dentro del clic del usuario,
                // lo que permite a Chrome/Edge desbloquear el audio.
                speakText("Sonido activado");

                playBeep();

            } catch (error) {

                console.error(
                    "Error activando sonido:",
                    error
                );

                soundButton.textContent =
                    "❌ Sonido no disponible";
            }
        }


        // =================================
        // VOZ
        // =================================

        function speakText(text) {

            if (!soundEnabled || !('speechSynthesis' in window)) {
                return;
            }

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "es-CO";
            speech.rate = 0.85;
            speech.pitch = 1;
            speech.volume = 1;

            window.speechSynthesis.speak(speech);
        }


        // =================================
        // SONIDO
        // =================================

        function playBeep() {

            if (
                !soundEnabled ||
                !audioContext
            ) {
                return;
            }

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type =
                "sine";

            oscillator.frequency.value =
                880;

            gain.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.35,
                audioContext.currentTime + 0.03
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                audioContext.currentTime + 0.35
            );

            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + 0.4
            );

        }


        // =================================
        // AVISO SONORO COMPLETO
        // =================================

        function announceTurn(
            ticket,
            service
        ) {

            if (!soundEnabled) {
                return;
            }

            playBeep();

            setTimeout(
                () => {
                    playBeep();
                },
                500
            );

            setTimeout(
                () => {

                    const spokenTicket =
                        String(ticket)
                            .replace(/-/g, " ");

                    speakText(
                        `Turno ${spokenTicket}. Puede pasar. ${service || ""}`
                    );

                },
                900
            );
        }


        // =================================
        // MOSTRAR AVISO
        // =================================

        function showCallScreen(
            ticket,
            service
        ) {

            callTicket.textContent =
                ticket;


            callService.textContent =
                service;


            callOverlay.classList.add(
                "show"
            );


            announceTurn(
                ticket,
                service
            );


            if (overlayTimer) {

                clearTimeout(
                    overlayTimer
                );

            }


            overlayTimer =
                setTimeout(
                    () => {

                        callOverlay.classList.remove(
                            "show"
                        );

                    },
                    5000
                );

        }


        // =================================
        // CARGAR BARBERÍA
        // =================================

        async function loadBusiness() {

            updateStatus.textContent =
                "Conectando...";


            const { data, error } =
                await client.rpc(
                    "get_business_by_qr",
                    {
                        p_qr_slug: slug
                    }
                );


            if (error) {

                console.error(
                    "Error barbería:",
                    error
                );


                updateStatus.textContent =
                    "Error de conexión";


                return;

            }


            if (
                !data ||
                data.length === 0
            ) {

                updateStatus.textContent =
                    "Barbería no encontrada";


                return;

            }


            business =
                data[0];


            businessName.textContent =
                "💈 " + business.name;


            businessCity.textContent =
                business.city || "";


            await loadQueue();

        }


        // =================================
        // CARGAR COLA
        // =================================

        async function loadQueue() {

            if (!business) {
                return;
            }


            await loadCurrentTicket();


            await loadNextTicket();


            updateStatus.textContent =
                "Actualizado · " +
                new Date()
                    .toLocaleTimeString(
                        "es-CO"
                    );

        }


        // =================================
        // TURNO ACTUAL
        // =================================

        async function loadCurrentTicket() {

            const { data, error } =
                await client.rpc(
                    "admin_current_ticket",
                    {
                        p_business_id:
                            business.id
                    }
                );


            if (error) {

                console.error(
                    "Error turno actual:",
                    error
                );


                currentTicket.textContent =
                    "—";


                currentService.textContent =
                    "Error";


                return;

            }


            if (
                data &&
                data.length > 0
            ) {

                const ticket =
                    data[0];


                currentTicket.textContent =
                    ticket.ticket_code;


                currentService.textContent =
                    ticket.service_name;


                // =================================
                // DETECTAR NUEVO TURNO
                // =================================

                if (
                    !firstLoad &&
                    previousTicketId !== null &&
                    ticket.id !== previousTicketId
                ) {

                    showCallScreen(
                        ticket.ticket_code,
                        ticket.service_name
                    );

                }


                previousTicketId =
                    ticket.id;


            } else {

                currentTicket.textContent =
                    "—";


                currentService.textContent =
                    "Esperando cliente";


                previousTicketId =
                    null;

            }


            firstLoad = false;

        }


        // =================================
        // SIGUIENTE TURNO
        // =================================

        async function loadNextTicket() {

            const { data, error } =
                await client.rpc(
                    "admin_waiting_tickets",
                    {
                        p_business_id:
                            business.id
                    }
                );


            if (error) {

                console.error(
                    "Error siguiente:",
                    error
                );


                nextTicket.textContent =
                    "—";


                nextService.textContent =
                    "Error";


                return;

            }


            if (
                !data ||
                data.length === 0
            ) {

                nextTicket.textContent =
                    "—";


                nextService.textContent =
                    "No hay clientes esperando";


                return;

            }


            const next =
                data[0];


            nextTicket.textContent =
                next.ticket_code;


            nextService.textContent =
                next.service_name;

        }


        // =================================
        // ACTUALIZACIÓN AUTOMÁTICA
        // =================================

        setInterval(
            loadQueue,
            5000
        );


        // =================================
        // INICIAR
        // =================================

        loadBusiness();

    </script>

</body>

</html>
