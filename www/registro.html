<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#172033">

    <title>TurnoBarber 360 - Crear cuenta</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>
        :root {
            --tb-navy: #172033;
            --tb-blue: #2855D9;
            --tb-green: #20B968;
            --tb-yellow: #F4C84A;
            --tb-bg: #F5F7FA;
            --tb-border: #D7DEEA;
            --tb-muted: #667085;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(40, 85, 217, 0.08), transparent 34%),
                var(--tb-bg);
            color: var(--tb-navy);
            font-family: Arial, Helvetica, sans-serif;
        }

        .registro-shell {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
        }

        .registro-card {
            width: min(100%, 560px);
            background: #ffffff;
            border: 1px solid rgba(23, 32, 51, 0.08);
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(23, 32, 51, 0.10);
            padding: 34px 34px 28px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-logo {
            display: block;
            width: min(100%, 270px);
            height: auto;
            margin: 0 auto 8px;
        }

        .brand-tagline {
            margin: 0;
            color: var(--tb-muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.7px;
        }

        .heading {
            text-align: center;
            margin: 24px 0 8px;
        }

        .heading h1 {
            margin: 0;
            color: var(--tb-navy);
            font-size: clamp(26px, 6vw, 32px);
            line-height: 1.15;
        }

        .heading p {
            margin: 10px auto 0;
            max-width: 430px;
            color: var(--tb-muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 28px 0 16px;
            color: var(--tb-navy);
            font-size: 15px;
            font-weight: 800;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 20px;
            border-radius: 4px;
            background: var(--tb-green);
            flex: 0 0 auto;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: var(--tb-navy);
            font-size: 14px;
            font-weight: 700;
        }

        .field input {
            display: block;
            width: 100%;
            min-height: 50px;
            padding: 13px 15px;
            border: 1px solid var(--tb-border);
            border-radius: 12px;
            background: #ffffff;
            color: var(--tb-navy);
            font-size: 15px;
            outline: none;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        .field input::placeholder {
            color: #98A2B3;
        }

        .field input:focus {
            border-color: var(--tb-blue);
            box-shadow: 0 0 0 3px rgba(40, 85, 217, 0.12);
        }

        .required-note {
            margin: -4px 0 18px;
            color: var(--tb-muted);
            font-size: 12px;
        }

        #registerButton {
            width: 100%;
            min-height: 52px;
            margin-top: 8px;
            border: 0;
            border-radius: 13px;
            background: var(--tb-blue);
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(40, 85, 217, 0.22);
            transition: transform .15s ease, filter .15s ease;
        }

        #registerButton:hover:not(:disabled) {
            filter: brightness(1.04);
            transform: translateY(-1px);
        }

        #registerButton:disabled {
            opacity: .72;
            cursor: not-allowed;
        }

        #registerMessage {
            min-height: 22px;
            margin: 14px 0 0;
            text-align: center;
            color: var(--tb-muted);
            font-size: 14px;
            line-height: 1.45;
        }

        .login-divider {
            height: 1px;
            margin: 26px 0 20px;
            background: #E7EBF2;
        }

        .login-link {
            margin: 0;
            text-align: center;
            color: var(--tb-muted);
            font-size: 14px;
        }

        .login-link a {
            display: inline-block;
            margin-top: 8px;
            color: var(--tb-blue);
            font-weight: 800;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .footer-brand {
            margin: 22px 0 0;
            text-align: center;
            color: #98A2B3;
            font-size: 11px;
            letter-spacing: .8px;
        }

        @media (max-width: 520px) {
            .registro-shell {
                padding: 14px 10px;
                align-items: flex-start;
            }

            .registro-card {
                margin-top: 8px;
                border-radius: 20px;
                padding: 26px 20px 22px;
            }

            .brand-logo {
                width: min(100%, 245px);
            }

            .heading {
                margin-top: 18px;
            }
        }
    </style>

</head>

<body>

    <main class="registro-shell">

        <section class="registro-card">

            <div class="brand">

                <img
                    class="brand-logo"
                    src="assets/brand/logo-maestro.png"
                    alt="TurnoBarber 360"
                >


            </div>

            <div class="heading">

                <h1>
                    Crear cuenta
                </h1>

                <p>
                    Registra tu barbería y comienza a administrar tu negocio con TurnoBarber 360.
                </p>

            </div>

            <form id="registerForm">

                <div class="section-title">
                    Datos del propietario
                </div>

                <div class="field">

                    <label for="ownerName">
                        Nombre del propietario
                    </label>

                    <input
                        id="ownerName"
                        type="text"
                        placeholder="Ej. Carlos Pérez"
                        autocomplete="name"
                        required
                    >

                </div>

                <div class="field">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="field">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="field">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <input
                        id="confirmPassword"
                        type="password"
                        placeholder="Repite la contraseña"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="section-title">
                    Datos de la barbería
                </div>

                <div class="field">

                    <label for="businessName">
                        Nombre de la barbería
                    </label>

                    <input
                        id="businessName"
                        type="text"
                        placeholder="Ej. Barbería Los Amigos"
                        required
                    >

                </div>

                <div class="field">

                    <label for="city">
                        Ciudad
                    </label>

                    <input
                        id="city"
                        type="text"
                        placeholder="Ej. Cartagena"
                        required
                    >

                </div>

                <div class="field">

                    <label for="phone">
                        Teléfono
                    </label>

                    <input
                        id="phone"
                        type="tel"
                        placeholder="Ej. 3001234567"
                        autocomplete="tel"
                    >

                </div>

                <p class="required-note">
                    Los campos de propietario, correo, contraseña, barbería y ciudad son obligatorios.
                </p>

                <button
                    id="registerButton"
                    type="submit"
                >
                    Crear mi barbería
                </button>

                <p id="registerMessage"></p>

            </form>

            <div class="login-divider"></div>

            <p class="login-link">
                ¿Ya tienes una cuenta?
                <br>
                <a href="login.html">
                    Iniciar sesión
                </a>
            </p>

            <p class="footer-brand">
                TURNOBARBER 360
            </p>

        </section>

    </main>

    <!-- SUPABASE -->

    <script src="supabase.js"></script>


    <script>


        // ==========================================
        // ELEMENTOS
        // ==========================================

        const registerForm =
            document.getElementById(
                "registerForm"
            );


        const registerButton =
            document.getElementById(
                "registerButton"
            );


        const registerMessage =
            document.getElementById(
                "registerMessage"
            );


        // ==========================================
        // REGISTRO
        // ==========================================

        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const ownerName =
                    document
                        .getElementById("ownerName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                const businessName =
                    document
                        .getElementById("businessName")
                        .value
                        .trim();


                const city =
                    document
                        .getElementById("city")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                // ==========================================
                // VALIDACIONES
                // ==========================================

                if (
                    password.length <
                    6
                ) {

                    registerMessage.textContent =
                        "❌ La contraseña debe tener mínimo 6 caracteres.";

                    return;
                }


                if (
                    password !==
                    confirmPassword
                ) {

                    registerMessage.textContent =
                        "❌ Las contraseñas no coinciden.";

                    return;
                }


                if (
                    !ownerName ||
                    !businessName ||
                    !city
                ) {

                    registerMessage.textContent =
                        "❌ Completa todos los campos obligatorios.";

                    return;
                }


                // ==========================================
                // DESACTIVAR BOTÓN
                // ==========================================

                registerButton.disabled =
                    true;


                registerButton.textContent =
                    "🔄 Creando cuenta...";


                registerMessage.textContent =
                    "";


                try {


                    // ==========================================
                    // CREAR USUARIO EN SUPABASE AUTH
                    // ==========================================

                    const {
                        data,
                        error
                    } =
                        await client.auth.signUp({

                            email:
                                email,

                            password:
                                password,

                            options: {

                                emailRedirectTo:
                                    "https://randres0613.github.io/turnobarber/login.html"

                            }

                        });


                    if (error) {
                        throw error;
                    }


                    if (
                        !data ||
                        !data.user
                    ) {

                        throw new Error(
                            "No se pudo crear el usuario."
                        );

                    }


                    // ==========================================
                    // GUARDAR DATOS DE LA BARBERÍA
                    // ==========================================
                    //
                    // Como la cuenta debe confirmar primero
                    // el correo, guardamos temporalmente los
                    // datos necesarios para continuar después
                    // del inicio de sesión.
                    //

                    localStorage.setItem(
                        "turnobarber_pending_business",
                        JSON.stringify({

                            owner_name:
                                ownerName,

                            business_name:
                                businessName,

                            city:
                                city,

                            phone:
                                phone || null

                        })
                    );


                    // ==========================================
                    // RESULTADO
                    // ==========================================

                    registerMessage.textContent =
                        "✅ Cuenta creada. Revisa tu correo para confirmar la cuenta.";


                    registerButton.textContent =
                        "📧 Revisa tu correo";


                    // ==========================================
                    // NO INTENTAR CREAR LA BARBERÍA TODAVÍA
                    // ==========================================
                    //
                    // La cuenta aún no está confirmada.
                    // La creación de la barbería se hará después
                    // de confirmar el correo e iniciar sesión.
                    //

                    registerButton.disabled =
                        true;


                } catch (error) {


                    console.error(
                        "ERROR REGISTRO:",
                        error
                    );


                    registerMessage.textContent =
                        "❌ " + error.message;


                    registerButton.disabled =
                        false;


                    registerButton.textContent =
                        "💈 Crear mi barbería";

                }

            }
        );


    </script>


</body>

</html>
