<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TurnoBarber 360 - Acceso</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <style id="turnobarber360-login-brand">
        :root{
            --tb360-navy:#172033;
            --tb360-blue:#2855D9;
            --tb360-green:#20B968;
            --tb360-yellow:#F4C84A;
            --tb360-bg:#F5F7FA;
            --tb360-text:#172033;
            --tb360-muted:#667085;
        }
        body{
            background:
                radial-gradient(circle at 50% 0%, rgba(40,85,217,.10), transparent 34%),
                var(--tb360-bg) !important;
            color:var(--tb360-text);
            min-height:100vh;
        }
        #loginApp,#recoveryApp{
            max-width:520px !important;
            margin:32px auto !important;
            padding:34px 32px 30px !important;
            box-sizing:border-box;
            background:rgba(255,255,255,.98) !important;
            border:1px solid rgba(23,32,51,.08) !important;
            border-radius:24px !important;
            box-shadow:0 18px 50px rgba(23,32,51,.12) !important;
        }
        .tb360-brand{
            text-align:center;
            margin:0 0 24px;
        }
        .tb360-brand img{
            width:min(260px,78%);
            height:auto;
            display:block;
            margin:0 auto 8px;
            object-fit:contain;
        }
#loginApp > h1,#recoveryApp > h1{display:none;}
        #loginApp > h2,#recoveryApp > h2{
            margin:0 0 10px !important;
            text-align:center;
            color:var(--tb360-navy) !important;
            font-size:25px;
            line-height:1.2;
        }
        #loginApp > p,#recoveryApp > p{
            text-align:center;
            color:var(--tb360-muted) !important;
            margin:0 0 25px !important;
        }
        #loginForm label,#recoveryForm label{
            display:block;
            color:var(--tb360-navy);
            font-weight:700;
            font-size:14px;
            margin-bottom:7px;
        }
        #loginForm input,#recoveryForm input{
            width:100% !important;
            box-sizing:border-box !important;
            min-height:50px;
            padding:13px 15px !important;
            margin-top:0 !important;
            border:1px solid #D8DEE8 !important;
            border-radius:12px !important;
            background:#FFFFFF !important;
            color:var(--tb360-navy);
            font-size:15px;
            outline:none;
            transition:border-color .2s ease,box-shadow .2s ease;
        }
        #loginForm input:focus,#recoveryForm input:focus{
            border-color:var(--tb360-blue) !important;
            box-shadow:0 0 0 4px rgba(40,85,217,.12);
        }
        #loginButton,#recoveryButton,#loginApp a[href="registro.html"]{
            width:100% !important;
            min-height:50px;
            border-radius:12px !important;
            box-sizing:border-box;
            font-weight:800;
        }
        #loginButton,#recoveryButton{
            background:var(--tb360-blue) !important;
            border-color:var(--tb360-blue) !important;
            box-shadow:0 8px 18px rgba(40,85,217,.20);
        }
        #loginButton:hover,#recoveryButton:hover,#loginApp a[href="registro.html"]:hover{
            transform:translateY(-1px);
        }
        #loginApp a[href="registro.html"]{
            display:flex !important;
            align-items:center;
            justify-content:center;
            text-decoration:none;
            background:var(--tb360-navy) !important;
            border-color:var(--tb360-navy) !important;
        }
        #forgotPasswordButton{
            width:100% !important;
            min-height:48px;
            border-radius:12px !important;
            background:#FFFFFF !important;
            color:var(--tb360-navy) !important;
            border:1px solid #D8DEE8 !important;
            font-weight:700;
        }
        #forgotPasswordButton:hover{
            border-color:var(--tb360-blue) !important;
            color:var(--tb360-blue) !important;
        }
        #loginApp hr,#recoveryApp hr{
            border:0;
            border-top:1px solid #E4E8EF;
            margin:26px 0 !important;
        }
        #loginMessage,#forgotMessage,#recoveryMessage{
            color:var(--tb360-muted);
            font-size:14px;
            text-align:center;
            line-height:1.45;
        }
        @media (max-width:600px){
            #loginApp,#recoveryApp{
                width:calc(100% - 24px);
                margin:12px auto !important;
                padding:28px 20px 24px !important;
                border-radius:20px !important;
            }
            .tb360-brand img{width:min(230px,82%);}
            #loginApp > h2,#recoveryApp > h2{font-size:22px;}
        }
    </style>

</head>


<body>


    <!-- ==========================================
         INICIO DE SESIÓN
    =========================================== -->

    <main
        id="loginApp"
        class="card hero"
        style="max-width: 500px; margin: 50px auto;"
    >

        <div class="tb360-brand">
            <img src="assets/brand/logo-maestro.png" alt="TurnoBarber 360">
        </div>

        <h2>Acceso administrador</h2>

        <p>
            Inicia sesión para administrar tu barbería.
        </p>


        <form id="loginForm">

            <div style="margin-bottom: 15px;">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Correo electrónico"
                    autocomplete="email"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <div style="margin-bottom: 15px;">

                <label for="password">
                    Contraseña
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <button
                id="loginButton"
                type="submit"
                class="btn primary big"
                style="width: 100%;"
            >
                🔐 Iniciar sesión
            </button>


            <p
                id="loginMessage"
                style="margin-top: 15px;"
            ></p>

        </form>


        <hr style="margin: 25px 0;">


        <!-- ==========================================
             CREAR CUENTA
        =========================================== -->

        <div style="text-align: center; margin-bottom: 20px;">

            <p style="margin-bottom: 10px;">
                ¿Aún no tienes una cuenta?
            </p>

            <a
                href="registro.html"
                class="btn primary big"
                style="
                    display: block;
                    width: 100%;
                    box-sizing: border-box;
                    text-decoration: none;
                "
            >
                🆕 Crear mi barbería
            </a>

        </div>


        <!-- ==========================================
             RECUPERAR CONTRASEÑA
        =========================================== -->

        <button
            id="forgotPasswordButton"
            class="btn"
            type="button"
            style="width: 100%;"
        >
            🔑 Olvidé mi contraseña
        </button>


        <p
            id="forgotMessage"
            style="margin-top: 15px;"
        ></p>

    </main>


    <!-- ==========================================
         CAMBIAR CONTRASEÑA
    =========================================== -->

    <main
        id="recoveryApp"
        class="card hero"
        style="max-width: 500px; margin: 50px auto; display: none;"
    >

        <div class="tb360-brand">
            <img src="assets/brand/logo-maestro.png" alt="TurnoBarber 360">
        </div>

        <h2>Crear nueva contraseña</h2>

        <p>
            Escribe una nueva contraseña para tu cuenta.
        </p>


        <form id="recoveryForm">

            <div style="margin-bottom: 15px;">

                <label for="newPassword">
                    Nueva contraseña
                </label>

                <input
                    id="newPassword"
                    type="password"
                    placeholder="Nueva contraseña"
                    autocomplete="new-password"
                    minlength="6"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <div style="margin-bottom: 15px;">

                <label for="confirmPassword">
                    Confirmar contraseña
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Repite la contraseña"
                    autocomplete="new-password"
                    minlength="6"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <button
                id="recoveryButton"
                type="submit"
                class="btn primary big"
                style="width: 100%;"
            >
                🔐 Guardar nueva contraseña
            </button>


            <p
                id="recoveryMessage"
                style="margin-top: 15px;"
            ></p>

        </form>

    </main>


    <!-- SUPABASE -->

    <script src="supabase.js"></script>


    <script>


        // ==========================================
        // ELEMENTOS
        // ==========================================

        const loginApp =
            document.getElementById("loginApp");


        const recoveryApp =
            document.getElementById("recoveryApp");


        const loginForm =
            document.getElementById("loginForm");


        const loginButton =
            document.getElementById("loginButton");


        const loginMessage =
            document.getElementById("loginMessage");


        const forgotPasswordButton =
            document.getElementById(
                "forgotPasswordButton"
            );


        const forgotMessage =
            document.getElementById("forgotMessage");


        const recoveryForm =
            document.getElementById("recoveryForm");


        const recoveryButton =
            document.getElementById("recoveryButton");


        const recoveryMessage =
            document.getElementById("recoveryMessage");


        // ==========================================
        // MOSTRAR LOGIN
        // ==========================================

        function showLogin() {

            loginApp.style.display =
                "block";

            recoveryApp.style.display =
                "none";

        }


        // ==========================================
        // MOSTRAR RECUPERACIÓN
        // ==========================================

        function showRecovery() {

            loginApp.style.display =
                "none";

            recoveryApp.style.display =
                "block";

        }


        // ==========================================
        // OBTENER BARBERÍA PENDIENTE
        // ==========================================

        function getPendingBusiness() {

            const saved =
                localStorage.getItem(
                    "turnobarber_pending_business"
                );


            if (!saved) {

                return null;

            }


            try {

                return JSON.parse(saved);

            } catch (error) {

                console.error(
                    "ERROR LEYENDO BARBERÍA PENDIENTE:",
                    error
                );


                localStorage.removeItem(
                    "turnobarber_pending_business"
                );


                return null;

            }

        }


        // ==========================================
        // BORRAR BARBERÍA PENDIENTE
        // ==========================================

        function clearPendingBusiness() {

            localStorage.removeItem(
                "turnobarber_pending_business"
            );

        }


        // ==========================================
        // CREAR BARBERÍA DESPUÉS DEL LOGIN
        // ==========================================

        async function createPendingBusiness() {

            const pendingBusiness =
                getPendingBusiness();


            if (!pendingBusiness) {

                return true;

            }


            loginMessage.textContent =
                "🏪 Configurando tu organización y barbería...";


            const timezone =
                Intl.DateTimeFormat().resolvedOptions().timeZone;


            if (!timezone) {

                throw new Error(
                    "No se pudo determinar la zona horaria de tu dispositivo."
                );

            }


            const organizationName =
                (
                    pendingBusiness.organization_name ||
                    pendingBusiness.business_name ||
                    ""
                ).trim();


            if (!organizationName) {

                throw new Error(
                    "No se encontró el nombre de la organización."
                );

            }


            const {
                data,
                error
            }
                =
                await client.rpc(
                    "create_initial_organization_business_for_current_user",
                    {
                        p_organization_name:
                            organizationName,

                        p_business_name:
                            pendingBusiness.business_name,

                        p_city:
                            pendingBusiness.city,

                        p_phone:
                            pendingBusiness.phone || null,

                        p_timezone:
                            timezone
                    }
                );


            if (error) {

                console.error(
                    "ERROR CREANDO ORGANIZACIÓN Y BARBERÍA:",
                    error
                );


                throw error;

            }


            if (
                !data ||
                data.length === 0
            ) {

                throw new Error(
                    "No se pudo crear la organización y la barbería."
                );

            }


            const createdBusiness =
                data[0];


            console.log(
                "ORGANIZACIÓN Y BARBERÍA CREADAS:",
                createdBusiness
            );


            clearPendingBusiness();


            loginMessage.textContent =
                "✅ Organización y barbería creadas correctamente.";


            return true;

        }


        // ==========================================
        // INICIAR SESIÓN
        // ==========================================

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "🔄 Iniciando sesión...";


                loginMessage.textContent =
                    "";


                try {

                    const {
                        data,
                        error
                    } =
                        await client.auth.signInWithPassword({

                            email:
                                email,

                            password:
                                password

                        });


                    if (error) {

                        throw error;

                    }


                    if (
                        !data ||
                        !data.user
                    ) {

                        throw new Error(
                            "No se pudo iniciar sesión."
                        );

                    }


                    if (
                        !data.user.email_confirmed_at
                    ) {

                        await client.auth.signOut();


                        throw new Error(
                            "Debes confirmar tu correo electrónico antes de iniciar sesión."
                        );

                    }


                    loginMessage.textContent =
                        "✅ Inicio de sesión correcto.";


                    loginMessage.textContent =
                        "✅ Todo listo. Verificando acceso...";


                    let isPlatformAdmin = false;


                    try {

                        const {
                            data: platformAdminData,
                            error: platformAdminError
                        } =
                            await client.rpc(
                                "is_platform_admin"
                            );


                        if (platformAdminError) {

                            throw platformAdminError;

                        }


                        isPlatformAdmin =
                            platformAdminData === true;


                    } catch (platformAdminError) {

                        console.error(
                            "ERROR VERIFICANDO SUPERADMIN:",
                            platformAdminError
                        );

                    }


                    if (!isPlatformAdmin) {

                        await createPendingBusiness();

                    }


                    loginMessage.textContent =
                        isPlatformAdmin
                            ? "✅ Acceso Superadmin autorizado. Entrando..."
                            : "✅ Todo listo. Entrando al panel...";


                    setTimeout(
                        function() {

                            window.location.href =
                                isPlatformAdmin
                                    ? "superadmin.html"
                                    : "admin.html";

                        },
                        700
                    );


                } catch (error) {

                    console.error(
                        "ERROR LOGIN:",
                        error
                    );


                    loginMessage.textContent =
                        "❌ " + error.message;


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "🔐 Iniciar sesión";

                }

            }
        );


        // ==========================================
        // ENVIAR RECUPERACIÓN
        // ==========================================

        forgotPasswordButton.addEventListener(
            "click",
            async function() {

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                if (!email) {

                    forgotMessage.textContent =
                        "⚠️ Escribe primero tu correo electrónico.";

                    return;

                }


                forgotPasswordButton.disabled =
                    true;


                forgotPasswordButton.textContent =
                    "📨 Enviando...";


                forgotMessage.textContent =
                    "";


                try {

                    const {
                        error
                    } =
                        await client.auth.resetPasswordForEmail(
                            email,
                            {
                                redirectTo:
                                    "https://randres0613.github.io/turnobarber/login.html"
                            }
                        );


                    if (error) {

                        throw error;

                    }


                    forgotMessage.textContent =
                        "✅ Hemos enviado un enlace de recuperación a tu correo.";


                } catch (error) {

                    console.error(
                        "ERROR RECOVERY:",
                        error
                    );


                    forgotMessage.textContent =
                        "❌ " + error.message;

                }


                forgotPasswordButton.disabled =
                    false;


                forgotPasswordButton.textContent =
                    "🔑 Olvidé mi contraseña";

            }
        );


        // ==========================================
        // GUARDAR NUEVA CONTRASEÑA
        // ==========================================

        recoveryForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const newPassword =
                    document
                        .getElementById("newPassword")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                if (
                    newPassword.length <
                    6
                ) {

                    recoveryMessage.textContent =
                        "❌ La contraseña debe tener mínimo 6 caracteres.";

                    return;

                }


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    recoveryMessage.textContent =
                        "❌ Las contraseñas no coinciden.";

                    return;

                }


                recoveryButton.disabled =
                    true;


                recoveryButton.textContent =
                    "🔄 Guardando...";


                recoveryMessage.textContent =
                    "";


                try {

                    const {
                        error
                    } =
                        await client.auth.updateUser({
                            password:
                                newPassword
                        });


                    if (error) {

                        throw error;

                    }


                    recoveryMessage.textContent =
                        "✅ Contraseña actualizada correctamente.";


                    recoveryButton.textContent =
                        "✅ Contraseña guardada";


                    setTimeout(
                        async function() {

                            await client.auth.signOut();


                            window.location.href =
                                "login.html";

                        },
                        1500
                    );


                } catch (error) {

                    console.error(
                        "ERROR CAMBIANDO CONTRASEÑA:",
                        error
                    );


                    recoveryMessage.textContent =
                        "❌ " + error.message;


                    recoveryButton.disabled =
                        false;


                    recoveryButton.textContent =
                        "🔐 Guardar nueva contraseña";

                }

            }
        );


        // ==========================================
        // DETECTAR RECUPERACIÓN SUPABASE
        // ==========================================

        client.auth.onAuthStateChange(
            function(event, session) {

                console.log(
                    "AUTH EVENT:",
                    event
                );


                if (
                    event ===
                    "PASSWORD_RECOVERY"
                ) {

                    showRecovery();

                }

            }
        );


        // ==========================================
        // RESPALDO: DETECTAR RECOVERY EN URL
        // ==========================================

        if (
            window.location.hash.includes(
                "type=recovery"
            )
        ) {

            showRecovery();

        }


    </script>


</body>

</html>
