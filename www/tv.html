<script>

var SUPABASE_URL =
    "https://dkgkejulxkgvjrppsmly.supabase.co";

var SUPABASE_ANON_KEY =
    "sb_publishable_7mxRDvndqfxuf6rCbi8CpA_VWKgK9e2";

var params =
    new URLSearchParams(
        window.location.search
    );

var slug =
    params.get("b") ||
    "barberia-el-jefe";

var business =

var previousServing =

var firstLoad =
    true;

var soundEnabled =
    false;

var audioContext =
    null;

var overlayTimer =

var requestNumber =

var currentDayKey =

var businessName =

var barberGrid =

var updateStatus =

var soundButton =

var callOverlay =

var callBarber =

var callTicket =

var callService =

var tvDateTime = document.getElementById("tvDateTime");

var platformDateTime = document.getElementById("platformDateTime");

function updateTvDateTime() {
    var now = new Date();
    var dateLabel = now.toLocaleDateString("es-CO", {
        weekday: "short",
        day: "numeric",
        month: "short",
        year: "numeric"
    }) + " · " + now.toLocaleTimeString("es-CO", {
        hour: "numeric",
        minute: "2-digit"
    });

    if (tvDateTime) {
        tvDateTime.innerHTML = dateLabel;
    }

    if (platformDateTime) {
        platformDateTime.innerHTML = dateLabel;
    }
}

function formatBusinessTime(value) {
    if (!value) return "";

    var match = String(value).match(/^(\\d{2}):(\\d{2})/);

    if (!match) return String(value);

    var hour = Number(match[1]);
    var minute = match[2];
    var suffix = hour >= 12 ? "p. m." : "a. m.";
    var normalizedHour = hour % 12 || 12;

    return normalizedHour + ":" + minute + " " + suffix;
}

function getBusinessHoursLabel() {
    if (!business || !business.opening_time || !business.closing_time) {
        return "Horario no configurado";
    }

    return formatBusinessTime(business.opening_time) +
        " – " +
        formatBusinessTime(business.closing_time);
}

function getBusinessProfileImage() {
    return business && business.profile_image_url
        ? business.profile_image_url
        : "assets/brand/icon-maestro.png";
}

function getTodayKey() {

    var now =
        new Date();

    return (
        now.getFullYear() +
        "-" +
        String(
            now.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            now.getDate()
        ).padStart(2, "0")
    );
}

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

function rpcRequest(
    functionName,
    body,
    callback
) {

    var xhr =
        new XMLHttpRequest();

    var url =
        SUPABASE_URL +
        "/rest/v1/rpc/" +
        functionName;

    xhr.open(
        "POST",
        url,
        true
    );

    xhr.setRequestHeader(
        "Content-Type",
        "application/json"
    );

    xhr.setRequestHeader(
        "apikey",
        SUPABASE_ANON_KEY
    );

    xhr.setRequestHeader(
        "Authorization",
        "Bearer " +
        SUPABASE_ANON_KEY
    );

    xhr.onreadystatechange =
        function() {

            if (
                xhr.readyState !== 4
            ) {

                return;

            }

            if (
                xhr.status >= 200 &&
                xhr.status < 300
            ) {

                var result =
                    null;

                try {

                    result =
                        JSON.parse(
                            xhr.responseText
                        );

                } catch (e) {

                    result =
                        null;

                }

                callback(
                    null,
                    result
                );

            } else {

                callback(
                    xhr.status +
                    " " +
                    xhr.statusText,
                    null
                );

            }

        };

    xhr.onerror =
        function() {

            callback(
                "Error de conexión",
                null
            );

        };

    try {

        xhr.send(
            JSON.stringify(body)
        );

    } catch (e) {

        callback(
            e.message ||
            "Error enviando solicitud",
            null
        );

    }

}

function activateSound() {

    try {

        var AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (
            AudioContextClass
        ) {

            audioContext =
                new AudioContextClass();

            if (
                audioContext.resume
            ) {

                audioContext.resume();

            }

            soundEnabled =
                true;

            soundButton.innerHTML =
                "🔊 Sonido activado";

            soundButton.className =
                "sound-button active";

            playBeep();

        } else {

            soundEnabled =
                true;

            soundButton.innerHTML =
                "🔊 Sonido activado";

            soundButton.className =
                "sound-button active";

        }

    } catch (e) {

        soundEnabled =
            true;

        soundButton.innerHTML =
            "🔊 Sonido activado";

        soundButton.className =
            "sound-button active";

    }

}

function playBeep() {

    if (
        !soundEnabled ||
        !audioContext
    ) {

        return;

    }

    try {

        var oscillator =
            audioContext.createOscillator();

        var gain =
            audioContext.createGain();

        oscillator.type =
            "sine";

        oscillator.frequency.value =
            880;

        gain.gain.setValueAtTime(
            0.0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.35,
            audioContext.currentTime +
            0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime +
            0.35
        );

        oscillator.connect(
            gain
        );

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            0.4
        );

    } catch (e) {
    }

}

function speakText(text) {

    if (
        !soundEnabled ||
        !window.speechSynthesis
    ) {

        return;

    }

    try {

        window.speechSynthesis.cancel();

        var speech =
            new SpeechSynthesisUtterance(
                text
            );

        speech.lang =
            "es-CO";

        speech.rate =
            0.85;

        speech.pitch =
            1;

        speech.volume =
            1;

        window.speechSynthesis.speak(
            speech
        );

    } catch (e) {
    }

}

function getAnnouncementKey(
    barberId
) {

    return (
        "turnobarber_last_call_" +
        slug +
        "_" +
        currentDayKey +
        "_" +
        barberId
    );

}

function getLastAnnounced(
    barberId
) {

    try {

        return localStorage.getItem(
            getAnnouncementKey(
                barberId
            )
        );

    } catch (e) {

        return null;

    }

}

function saveLastAnnounced(
    barberId,
    ticketId
) {

    try {

        localStorage.setItem(
            getAnnouncementKey(
                barberId
            ),
            String(
                ticketId
            )
        );

    } catch (e) {
    }

}

function showCallScreen(
    ticket,
    service,
    barber,
    barberId,
    ticketId
) {

    callBarber.innerHTML =
        escapeHtml(
            barber
        );

    callTicket.innerHTML =
        escapeHtml(
            ticket
        );

    callService.innerHTML =
        escapeHtml(
            service ||
            "Barbería"
        );

    callOverlay.className =
        "call-overlay show";

    if (
        barberId &&
        ticketId
    ) {

        saveLastAnnounced(
            barberId,
            ticketId
        );

    }

    if (
        soundEnabled
    ) {

        playBeep();

        setTimeout(
            function() {

                playBeep();

            },
            500
        );

        setTimeout(
            function() {

                speakText(
                    "Atención. Turno " +
                    String(
                        ticket
                    ).replace(
                        /-/g,
                        " "
                    ) +
                    ". Con " +
                    barber +
                    ". Servicio de " +
                    (
                        service ||
                        "barbería"
                    ) +
                    ". Puede pasar."
                );

            },
            900
        );

    }

    if (
        overlayTimer
    ) {

        clearTimeout(
            overlayTimer
        );

    }

    overlayTimer =
        setTimeout(
            function() {

                callOverlay.className =
                    "call-overlay";

            },
            9000
        );

}

function loadBusiness() {

    updateStatus.innerHTML =
        "Conectando...";

    rpcRequest(
        "get_business_by_qr",
        {
            p_qr_slug:
                slug
        },
        function(
            error,
            data
        ) {

            if (
                error
            ) {

                console.log(
                    "Error negocio:",
                    error
                );

                updateStatus.innerHTML =
                    "Error de conexión";

                return;

            }

            if (
                !data ||
                !data.length
            ) {

                updateStatus.innerHTML =
                    "Barbería no encontrada";

                return;

            }

            business =
                data[0];

            businessName.innerHTML =
                escapeHtml(
                    business.name
                );

            businessCity.innerHTML =
                escapeHtml(
                    business.city ||
                    ""
                );

            businessHours.innerHTML =
                "🕘 " +
                escapeHtml(
                    getBusinessHoursLabel()
                );

            businessLogo.src =
                getBusinessProfileImage();

            businessLogo.alt =
                business.name ||
                "Foto de la barbería";

            loadQueues();

        }
    );

}

function render(
    rows
) {

    var count =
        rows.length;

    if (
        count === 1
    ) {

        barberGrid.className =
            "barber-grid one";

    } else if (
        count === 3
    ) {

        barberGrid.className =
            "barber-grid three";

    } else {

        barberGrid.className =
            "barber-grid";

    }

    if (
        !count
    ) {

        barberGrid.innerHTML =
            '<div class="barber-card">' +
            '<div class="empty">' +
            'No hay barberos activos.' +
            '</div>' +
            '</div>';

        return;

    }

    var html =
        "";

    for (
        var i = 0;
        i < rows.length;
        i++
    ) {

        var r =
            rows[i];

        var busy =
            !!r.current_ticket_id;

        var waiting =
            Number(
                r.waiting_count ||
                0
            );

        html +=
            '<article class="barber-card ' +
            (
                busy
                    ? "busy"
                    : ""
            ) +
            '">' +

            '<div class="barber-name">' +

            '<span class="dot ' +
            (
                busy
                    ? ""
                    : "waiting"
            ) +
            '"></span>' +

            escapeHtml(
                r.barber_name
            ) +

            '</div>' +

            '<div class="status">' +

            (
                busy
                    ? "🟢 ATENDIENDO"
                    : "🟡 DISPONIBLE"
            ) +

            '</div>' +

            '<div class="current-block">' +

            '<div class="label">' +
            'Ahora atendiendo' +
            '</div>';

        if (
            r.current_ticket_code
        ) {

            html +=
                '<div class="current-ticket">' +

                escapeHtml(
                    r.current_ticket_code
                ) +

                '</div>' +

                '<div class="service">' +

                escapeHtml(
                    r.current_service_name ||
                    "Servicio"
                ) +

                '</div>';

        } else {

            html +=
                '<div class="empty">' +
                'Sin cliente en atención' +
                '</div>';

        }

        html +=
            '</div>' +

            '<div class="next-block">' +

            '<div class="next-info">' +

            '<div class="label">' +
            'Siguiente con ' +

            escapeHtml(
                r.barber_name
            ) +

            '</div>';

        if (
            r.next_ticket_code
        ) {

            html +=
                '<div class="next-ticket">' +

                escapeHtml(
                    r.next_ticket_code
                ) +

                '</div>' +

                '<div class="next-service">' +

                escapeHtml(
                    r.next_service_name ||
                    "Servicio"
                ) +

                '</div>';

        } else {

            html +=
                '<div class="empty">' +
                'Sin clientes esperando' +
                '</div>';

        }

        html +=
            '</div>' +

            '<div class="waiting-count">' +
            '👥 ' +
            waiting +
            ' esperando' +
            '</div>' +

            '</div>' +

            '</article>';

    }

    barberGrid.innerHTML =
        html;

}

function loadQueues() {

    if (
        !business
    ) {

        return;

    }

    requestNumber++;

    var thisRequest =
        requestNumber;

    rpcRequest(
        "public_barber_queues",
        {
            p_business_id:
                business.id
        },
        function(
            error,
            data
        ) {

            if (
                thisRequest !==
                requestNumber
            ) {

                return;

            }

            if (
                error
            ) {

                console.log(
                    "Error colas:",
                    error
                );

                updateStatus.innerHTML =
                    "Error cargando colas";

                return;

            }

            var rows =
                data ||
                [];

            for (
                var i = 0;
                i < rows.length;
                i++
            ) {

                var r =
                    rows[i];

                if (
                    !r.current_ticket_id
                ) {

                    continue;

                }

                var currentId =
                    String(
                        r.current_ticket_id
                    );

                var previousId =
                    previousServing[
                        r.barber_id
                    ];

                var changedFromMemory =
                    (
                        !firstLoad &&
                        currentId !==
                        previousId
                    );

                var lastAnnounced =
                    getLastAnnounced(
                        r.barber_id
                    );

                var notAnnouncedYet =
                    (
                        lastAnnounced !==
                        currentId
                    );

                if (
                    changedFromMemory ||
                    notAnnouncedYet
                ) {

                    showCallScreen(
                        r.current_ticket_code,
                        r.current_service_name,
                        r.barber_name,
                        r.barber_id,
                        r.current_ticket_id
                    );

                    break;

                }

            }

            previousServing =
                {};

            for (
                var j = 0;
                j < rows.length;
                j++
            ) {

                previousServing[
                    rows[j].barber_id
                ] =
                    rows[j].current_ticket_id
                    ||
                    null;

            }

            firstLoad =
                false;

            render(
                rows
            );

            updateStatus.innerHTML =
                "Actualizado · " +
                new Date()
                    .toLocaleTimeString(
                        "es-CO"
                    );

        }
    );

}

function startApplication() {

    loadBusiness();

    setInterval(
        function() {

            loadQueues();

        },
        5000
    );

}

updateTvDateTime();
setInterval(updateTvDateTime, 1000);

startApplication();

</script>
