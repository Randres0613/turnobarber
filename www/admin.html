<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TurnoBarber 360 - Panel</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header class="topbar">

        <div class="topbar-brand">
            <img
                src="assets/brand/icon-maestro.png"
                alt="TurnoBarber 360"
                class="topbar-brand-icon"
            >
            <div>
                <h1>TurnoBarber 360</h1>
                <p id="businessInfo">Cargando barbería...</p>
                <p id="adminDateTime" class="admin-date-time">Cargando fecha y hora...</p>
            </div>
        </div>

        <div class="topbar-actions">
            <button
                id="adminSettingsButton"
                type="button"
                class="topbar-settings-button"
                onclick="showAdminSettings()"
                aria-label="Abrir Mis ajustes"
                title="Mis ajustes"
                style="display:none;"
            >
                ⚙️
            </button>

            <span id="connectionStatus" class="badge">
                CONECTANDO
            </span>
        </div>

    </header>


    <!-- ==========================================
         ACCESO ADMINISTRADOR
    =========================================== -->

    <section
        id="loginApp"
        class="card hero"
        style="max-width: 500px; margin: 30px auto; display: none;"
    >

        <h2>Acceso administrador</h2>

        <p>
            Inicia sesión para administrar tu barbería.
        </p>

        <form id="loginForm">

            <div style="margin-bottom: 15px;">

                <label for="loginEmail">
                    Correo electrónico
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Correo electrónico"
                    autocomplete="email"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <div style="margin-bottom: 15px;">

                <label for="loginPassword">
                    Contraseña
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <button
                id="loginButton"
                type="submit"
                class="btn primary big"
            >
                Iniciar sesión
            </button>


            <p
                id="loginMessage"
                style="margin-top: 15px;"
            ></p>

        </form>

    </section>


    <!-- ==========================================
         PANEL ADMINISTRADOR
    =========================================== -->

   <main id="adminApp">

        <div class="card hero">

            <h2>
                ⏳ Cargando panel...
            </h2>

            <p>
                Espera un momento.
            </p>

        </div>

    </main>


    <script src="supabase.js"></script>
    <script src="admin.js"></script>

</body>
</html>
