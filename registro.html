<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TurnoBarber - Crear cuenta</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


    <main
        class="card hero"
        style="max-width: 550px; margin: 40px auto;"
    >

        <h1>
            💈 TurnoBarber
        </h1>

        <h2>
            Crear cuenta
        </h2>

        <p>
            Registra tu barbería para comenzar a utilizar TurnoBarber.
        </p>


        <form id="registerForm">


            <!-- PROPIETARIO -->

            <div style="margin-bottom: 15px;">

                <label for="ownerName">
                    Nombre del propietario
                </label>

                <input
                    id="ownerName"
                    type="text"
                    placeholder="Ej: Carlos Pérez"
                    autocomplete="name"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <!-- CORREO -->

            <div style="margin-bottom: 15px;">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="correo@ejemplo.com"
                    autocomplete="email"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <!-- CONTRASEÑA -->

            <div style="margin-bottom: 15px;">

                <label for="password">
                    Contraseña
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Mínimo 6 caracteres"
                    autocomplete="new-password"
                    minlength="6"
                    required
                style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <!-- CONFIRMAR CONTRASEÑA -->

            <div style="margin-bottom: 15px;">

                <label for="confirmPassword">
                    Confirmar contraseña
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Repite la contraseña"
                    autocomplete="new-password"
                    minlength="6"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <!-- BARBERÍA -->

            <div style="margin-bottom: 15px;">

                <label for="businessName">
                    Nombre de la barbería
                </label>

                <input
                    id="businessName"
                    type="text"
                    placeholder="Ej: Barbería Los Amigos"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <!-- CIUDAD -->

            <div style="margin-bottom: 15px;">

                <label for="city">
                    Ciudad
                </label>

                <input
                    id="city"
                    type="text"
                    placeholder="Ej: Cartagena"
                    required
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <!-- TELÉFONO -->

            <div style="margin-bottom: 15px;">

                <label for="phone">
                    Teléfono
                </label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="Ej: 3001234567"
                    autocomplete="tel"
                    style="width: 100%; padding: 10px; margin-top: 5px;"
                >

            </div>


            <!-- BOTÓN -->

            <button
                id="registerButton"
                type="submit"
                class="btn primary big"
                style="width: 100%;"
            >
                💈 Crear mi barbería
            </button>


            <!-- MENSAJE -->

            <p
                id="registerMessage"
                style="margin-top: 15px;"
            ></p>


        </form>


        <hr style="margin: 25px 0;">


        <p style="text-align: center;">

            ¿Ya tienes una cuenta?

            <br>

            <a href="login.html">
                🔐 Iniciar sesión
            </a>

        </p>


    </main>


    <!-- SUPABASE -->

    <script src="supabase.js"></script>


    <script>


        // ==========================================
        // ELEMENTOS
        // ==========================================

        const registerForm =
            document.getElementById(
                "registerForm"
            );


        const registerButton =
            document.getElementById(
                "registerButton"
            );


        const registerMessage =
            document.getElementById(
                "registerMessage"
            );


        // ==========================================
        // REGISTRO
        // ==========================================

        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const ownerName =
                    document
                        .getElementById("ownerName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                const businessName =
                    document
                        .getElementById("businessName")
                        .value
                        .trim();


                const city =
                    document
                        .getElementById("city")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                // ==========================================
                // VALIDACIONES
                // ==========================================

                if (
                    password.length <
                    6
                ) {

                    registerMessage.textContent =
                        "❌ La contraseña debe tener mínimo 6 caracteres.";

                    return;
                }


                if (
                    password !==
                    confirmPassword
                ) {

                    registerMessage.textContent =
                        "❌ Las contraseñas no coinciden.";

                    return;
                }


                if (
                    !ownerName ||
                    !businessName ||
                    !city
                ) {

                    registerMessage.textContent =
                        "❌ Completa todos los campos obligatorios.";

                    return;
                }


                // ==========================================
                // DESACTIVAR BOTÓN
                // ==========================================

                registerButton.disabled =
                    true;


                registerButton.textContent =
                    "🔄 Creando cuenta...";


                registerMessage.textContent =
                    "";


                try {


                    // ==========================================
                    // CREAR USUARIO EN SUPABASE AUTH
                    // ==========================================

                    const {
                        data,
                        error
                    } =
                        await client.auth.signUp({

                            email:
                                email,

                            password:
                                password,

                            options: {

                                emailRedirectTo:
                                    "https://randres0613.github.io/turnobarber/login.html"

                            }

                        });


                    if (error) {
                        throw error;
                    }


                    if (
                        !data ||
                        !data.user
                    ) {

                        throw new Error(
                            "No se pudo crear el usuario."
                        );

                    }


                    // ==========================================
                    // GUARDAR DATOS DE LA BARBERÍA
                    // ==========================================
                    //
                    // Como la cuenta debe confirmar primero
                    // el correo, guardamos temporalmente los
                    // datos necesarios para continuar después
                    // del inicio de sesión.
                    //

                    localStorage.setItem(
                        "turnobarber_pending_business",
                        JSON.stringify({

                            owner_name:
                                ownerName,

                            business_name:
                                businessName,

                            city:
                                city,

                            phone:
                                phone || null

                        })
                    );


                    // ==========================================
                    // RESULTADO
                    // ==========================================

                    registerMessage.textContent =
                        "✅ Cuenta creada. Revisa tu correo para confirmar la cuenta.";


                    registerButton.textContent =
                        "📧 Revisa tu correo";


                    // ==========================================
                    // NO INTENTAR CREAR LA BARBERÍA TODAVÍA
                    // ==========================================
                    //
                    // La cuenta aún no está confirmada.
                    // La creación de la barbería se hará después
                    // de confirmar el correo e iniciar sesión.
                    //

                    registerButton.disabled =
                        true;


                } catch (error) {


                    console.error(
                        "ERROR REGISTRO:",
                        error
                    );


                    registerMessage.textContent =
                        "❌ " + error.message;


                    registerButton.disabled =
                        false;


                    registerButton.textContent =
                        "💈 Crear mi barbería";

                }

            }
        );


    </script>


</body>

</html>
